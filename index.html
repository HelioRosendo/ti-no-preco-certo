<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TI no Preço Certo — Orçamentos de Infraestrutura e Redes</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #0b1120;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-hover: #0284c7;
      --success: #10b981;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 48px;
    }

    header {
      background: var(--panel-2);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.15rem;
      color: #38bdf8;
    }

    .brand p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: 0.15s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-danger {
      background: transparent;
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    main {
      max-width: 1080px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      color: #e2e8f0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    input, select, textarea {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.88rem;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .summary-box {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 16px;
      background: var(--panel-2);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .summary-item span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .summary-item strong {
      font-size: 1.15rem;
      color: #38bdf8;
    }

    .summary-item.total strong {
      color: #34d399;
      font-size: 1.3rem;
    }

    /* Modal Configurações da Empresa */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .badge-info {
      display: inline-block;
      background: rgba(14, 165, 233, 0.15);
      color: #7dd3fc;
      border: 1px solid rgba(14, 165, 233, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      margin-bottom: 12px;
    }

    /* Área de Impressão / PDF */
    #pdf-area {
      display: none;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #111827 !important;
        padding: 0 !important;
      }

      header, main, .modal-backdrop {
        display: none !important;
      }

      #pdf-area {
        display: block !important;
        padding: 24px;
        color: #111827;
        background: #ffffff;
      }

      .pdf-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2px solid #1e293b;
        padding-bottom: 14px;
        margin-bottom: 18px;
      }

      .pdf-company-right {
        text-align: right;
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .pdf-section-title {
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        color: #0f172a;
        background: #f1f5f9;
        padding: 6px 10px;
        border-left: 4px solid #0284c7;
        margin: 18px 0 10px;
      }

      .pdf-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        margin-bottom: 12px;
      }

      .pdf-table th, .pdf-table td {
        border: 1px solid #cbd5e1;
        padding: 7px 8px;
        color: #111827;
      }

      .pdf-table th {
        background: #f8fafc;
      }

      .pdf-totals {
        margin-left: auto;
        width: 280px;
        font-size: 0.9rem;
      }

      .pdf-totals div {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #e2e8f0;
      }

      .pdf-totals .grand-total {
        font-size: 1.05rem;
        font-weight: 700;
        border-bottom: 2px solid #0f172a;
        padding-top: 8px;
      }

      .pdf-signatures {
        display: flex;
        justify-content: space-between;
        gap: 32px;
        margin-top: 48px;
        text-align: center;
        font-size: 0.85
